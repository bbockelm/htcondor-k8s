# CI for the Pod-interception approach: unit tests, the same suite against a
# real kube-apiserver, and -- the one that matters -- the whole thing against a
# real kube-controller-manager running in k3s.
name: virtualnode

on:
  push:
    paths: ["virtualnode/**", "shared/**", ".github/workflows/virtualnode.yml"]
  pull_request:
    paths: ["virtualnode/**", "shared/**", ".github/workflows/virtualnode.yml"]

env:
  GOWORK: "off"
  GOFLAGS: "-mod=mod"
  GOPRIVATE: "github.com/bbockelm,github.com/PelicanPlatform"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virtualnode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: unit tests
        run: go test ./internal/... ./api/... -count=1

  envtest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virtualnode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: install envtest assets
        run: |
          echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@latest use -p path)" >> "$GITHUB_ENV"
      - name: integration tests against a real API server
        # These suites skip themselves when their assets are missing, so
        # assert on named tests having run rather than on the absence of FAIL.
        run: |
          go test ./test/node/... ./test/podctl/... ./test/kubelet/... -count=1 -v -timeout 20m 2>&1 | tee out.txt
          grep -q -- '--- PASS: TestPodInterceptionDrivesAJobToCompletion' out.txt
          grep -q -- '--- PASS: TestAPIServerDefaultsPodReplacementPolicyBeforeAdmission' out.txt

  k3s:
    # This job is the only evidence that the real Job controller drives this
    # approach. The suite skips itself without a container runtime, which is
    # correct on a developer laptop and would be a vacuous pass here -- so the
    # greps below are not optional decoration, they are the assertion.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virtualnode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: docker is present
        run: docker info
      - name: against a real kube-controller-manager
        run: |
          go test ./test/k3s/... -count=1 -v -timeout 20m 2>&1 | tee out.txt
          grep -q -- '--- PASS: TestTheRealJobControllerDrivesAJobToCompletion' out.txt
          grep -q -- '--- PASS: TestTheRealJobControllerDefaultsPodReplacementPolicy' out.txt
          grep -q -- '--- PASS: TestAStampedJobIsLeftAloneByKubeScheduler' out.txt
          grep -q -- '--- PASS: TestKubectlLogsReachesTheVirtualKubelet' out.txt
          grep -q -- '--- PASS: TestKubectlLogsHonorsTailLines' out.txt
          grep -q -- '--- PASS: TestKubectlLogsFollowStreamsThroughTheProxy' out.txt
          grep -q -- '--- PASS: TestKubectlLogsFollowEndsForATerminalPod' out.txt
          if grep -q -- '--- SKIP' out.txt; then
            echo "::error::the k3s suite skipped a test on CI; a skip here tests nothing"
            exit 1
          fi
