# CI for the HTCJob operator: unit tests, then the same suite against a real
# kube-apiserver, then the k3d end-to-end path that needs a real cluster.
name: operator

on:
  push:
    paths: ["operator/**", "shared/**", ".github/workflows/operator.yml"]
  pull_request:
    paths: ["operator/**", "shared/**", ".github/workflows/operator.yml"]

env:
  GOWORK: "off"
  GOFLAGS: "-mod=mod"
  GOPRIVATE: "github.com/bbockelm,github.com/PelicanPlatform"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      - name: unit tests
        run: go test ./internal/... ./api/... -count=1

  envtest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: install envtest assets
        run: |
          echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@latest use -p path)" >> "$GITHUB_ENV"
      - name: integration tests against a real API server
        # The suite skips itself when the assets are missing, so assert on
        # the tests having run rather than on the absence of a failure.
        run: |
          go test ./test/envtest/... -count=1 -v -timeout 15m 2>&1 | tee out.txt
          grep -q -- '--- PASS: TestWebhookClaimsATranslatableJobAndTheControllersFollow' out.txt
          grep -q -- '--- PASS: TestCRDRejectsFieldsItDoesNotHave' out.txt

  k3d:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: real-cluster checks
        # Skips cleanly when Docker is unavailable.
        run: ./hack/k3d-e2e.sh
