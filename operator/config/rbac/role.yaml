---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: htcondor-operator
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - htcondor.org
  resources:
  - htcjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - htcondor.org
  resources:
  - htcjobs/finalizers
  verbs:
  - update
- apiGroups:
  - htcondor.org
  resources:
  - htcjobs/status
  verbs:
  - get
  - patch
  - update
