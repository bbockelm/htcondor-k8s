# The identity both halves of the virtual node run as. It is declared here
# rather than beside the Deployment so that applying config/rbac alone is
# enough to make the bindings resolve.
apiVersion: v1
kind: Namespace
metadata:
  name: htcondor-system
  labels:
    kubernetes.io/metadata.name: htcondor-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: htcondor-virtualnode
  namespace: htcondor-system
